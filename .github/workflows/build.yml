name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Unzip & Fix Manifest Automatically
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/DirectBootAware/directBootAware/g' app/src/main/AndroidManifest.xml
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLauncher-TabA7Lite-APK
          path: app/build/outputs/apk/debug/*.apk
